name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Backend unit tests
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: used_marketplace_frontend/package-lock.json

      - name: Frontend build
        working-directory: used_marketplace_frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python and frozen datasets
        run: |
          python -m compileall -q tools
          python tools/ragas_dataset_validate.py
