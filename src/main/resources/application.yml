server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: online-used-marketplace

  security:
    user:
      name: ${SPRING_SECURITY_USER:swagger}
      password: ${SPRING_SECURITY_PASSWORD}

  datasource:
    jdbc-url: ${MYSQL_URL:jdbc:mysql://localhost:3306/used_market?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:20MB}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:qwen-plus}
          temperature: ${OPENAI_TEMPERATURE:0.3}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-v3}

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: ${ELASTICSEARCH_CONNECTION_TIMEOUT:3s}
    socket-timeout: ${ELASTICSEARCH_SOCKET_TIMEOUT:10s}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:5}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:5000ms}

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:5s}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath:/mappers/*.xml
  type-aliases-package: org.example.online_used_marketplace.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_ENABLED:true}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: online-used-marketplace
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s,5s

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}
  token-header: Authorization
  token-prefix: Bearer

sms:
  code-expire-seconds: ${SMS_CODE_EXPIRE_SECONDS:300}
  send-interval-seconds: ${SMS_SEND_INTERVAL_SECONDS:60}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET:used-market}

ai:
  embedding:
    max-batch-size: ${AI_EMBEDDING_MAX_BATCH_SIZE:10}

  publish-feedback:
    auto-init: ${AI_PUBLISH_FEEDBACK_AUTO_INIT:true}

  token-governance:
    enabled: ${AI_TOKEN_GOVERNANCE_ENABLED:true}
    persist-enabled: ${AI_TOKEN_GOVERNANCE_PERSIST_ENABLED:true}
    recent-memory-limit: ${AI_TOKEN_RECENT_MEMORY_LIMIT:500}
    default-input-tokens: ${AI_TOKEN_DEFAULT_INPUT:4000}
    default-output-tokens: ${AI_TOKEN_DEFAULT_OUTPUT:500}
    rag-chat-input-tokens: ${AI_TOKEN_RAG_INPUT:6000}
    rag-chat-output-tokens: ${AI_TOKEN_RAG_OUTPUT:600}
    agent-final-input-tokens: ${AI_TOKEN_AGENT_FINAL_INPUT:4000}
    agent-final-output-tokens: ${AI_TOKEN_AGENT_FINAL_OUTPUT:400}
    agent-planner-input-tokens: ${AI_TOKEN_AGENT_PLANNER_INPUT:2000}
    agent-planner-output-tokens: ${AI_TOKEN_AGENT_PLANNER_OUTPUT:350}
    session-summary-input-tokens: ${AI_TOKEN_SUMMARY_INPUT:3000}
    session-summary-output-tokens: ${AI_TOKEN_SUMMARY_OUTPUT:300}
    preference-extraction-input-tokens: ${AI_TOKEN_PREFERENCE_INPUT:1200}
    preference-extraction-output-tokens: ${AI_TOKEN_PREFERENCE_OUTPUT:250}
    query-rewrite-input-tokens: ${AI_TOKEN_QUERY_REWRITE_INPUT:1500}
    query-rewrite-output-tokens: ${AI_TOKEN_QUERY_REWRITE_OUTPUT:350}
    semantic-chunking-input-tokens: ${AI_TOKEN_SEMANTIC_CHUNK_INPUT:3500}
    semantic-chunking-output-tokens: ${AI_TOKEN_SEMANTIC_CHUNK_OUTPUT:500}
    publish-optimize-input-tokens: ${AI_TOKEN_PUBLISH_OPTIMIZE_INPUT:2500}
    publish-optimize-output-tokens: ${AI_TOKEN_PUBLISH_OPTIMIZE_OUTPUT:600}

  knowledge:
    ingestion:
      auto-init: ${KNOWLEDGE_INGESTION_AUTO_INIT:true}
      max-file-size-mb: ${KNOWLEDGE_MAX_FILE_SIZE_MB:20}
      max-extracted-chars: ${KNOWLEDGE_MAX_EXTRACTED_CHARS:2000000}
      max-pdf-pages: ${KNOWLEDGE_MAX_PDF_PAGES:300}
      parser-timeout-ms: ${KNOWLEDGE_PARSER_TIMEOUT_MS:30000}
      raw-bucket: ${KNOWLEDGE_RAW_BUCKET:knowledge-source}
      parser-version: ${KNOWLEDGE_PARSER_VERSION:spring-ai-reader-1.0.3-v1}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-v3}
      rabbit:
        enabled: ${KNOWLEDGE_INGESTION_RABBIT_ENABLED:true}
        max-retries: ${KNOWLEDGE_INGESTION_MAX_RETRIES:2}
        retry-delay-ms: ${KNOWLEDGE_INGESTION_RETRY_DELAY_MS:3000}
        confirm-timeout-ms: ${KNOWLEDGE_INGESTION_CONFIRM_TIMEOUT_MS:3000}
        consumer-concurrency: ${KNOWLEDGE_INGESTION_CONSUMER_CONCURRENCY:1}
        prefetch: ${KNOWLEDGE_INGESTION_PREFETCH:1}
        recovery-initial-delay-ms: ${KNOWLEDGE_INGESTION_RECOVERY_INITIAL_DELAY_MS:15000}
        recovery-fixed-delay-ms: ${KNOWLEDGE_INGESTION_RECOVERY_FIXED_DELAY_MS:30000}
        queued-stale-seconds: ${KNOWLEDGE_INGESTION_QUEUED_STALE_SECONDS:60}
        running-stale-seconds: ${KNOWLEDGE_INGESTION_RUNNING_STALE_SECONDS:600}
        recovery-batch-size: ${KNOWLEDGE_INGESTION_RECOVERY_BATCH_SIZE:100}
    chunking:
      strategy-version: ${KNOWLEDGE_CHUNK_STRATEGY_VERSION:structure-semantic-v1}
      target-tokens: ${KNOWLEDGE_CHUNK_TARGET_TOKENS:450}
      max-tokens: ${KNOWLEDGE_CHUNK_MAX_TOKENS:600}
      min-tokens: ${KNOWLEDGE_CHUNK_MIN_TOKENS:100}
      overlap-tokens: ${KNOWLEDGE_CHUNK_OVERLAP_TOKENS:80}
      semantic-enabled: ${KNOWLEDGE_SEMANTIC_CHUNK_ENABLED:false}
      semantic-model-id: ${KNOWLEDGE_SEMANTIC_CHUNK_MODEL_ID:configured-chat-model}
      semantic-timeout-ms: ${KNOWLEDGE_SEMANTIC_CHUNK_TIMEOUT_MS:8000}
      semantic-window-tokens: ${KNOWLEDGE_SEMANTIC_WINDOW_TOKENS:2500}
      semantic-cache-ttl-minutes: ${KNOWLEDGE_SEMANTIC_CACHE_TTL_MINUTES:1440}
      semantic-cache-max-entries: ${KNOWLEDGE_SEMANTIC_CACHE_MAX_ENTRIES:2000}
    query-rewrite:
      enabled: ${KNOWLEDGE_QUERY_REWRITE_ENABLED:true}
      shadow-mode: ${KNOWLEDGE_QUERY_REWRITE_SHADOW_MODE:false}
      model-id: ${KNOWLEDGE_QUERY_REWRITE_MODEL_ID:configured-chat-model}
      cache-ttl-seconds: ${KNOWLEDGE_QUERY_REWRITE_CACHE_TTL_SECONDS:300}
      cache-max-entries: ${KNOWLEDGE_QUERY_REWRITE_CACHE_MAX_ENTRIES:1000}
      timeout-ms: ${KNOWLEDGE_QUERY_REWRITE_TIMEOUT_MS:15000}
      max-sub-queries: ${KNOWLEDGE_QUERY_REWRITE_MAX_SUB_QUERIES:3}
      max-synonym-queries: ${KNOWLEDGE_QUERY_REWRITE_MAX_SYNONYM_QUERIES:2}
      low-confidence-threshold: ${KNOWLEDGE_QUERY_REWRITE_LOW_CONFIDENCE:0.35}
      total-candidate-budget: ${KNOWLEDGE_QUERY_REWRITE_CANDIDATE_BUDGET:60}

  chat:
    memory:
      enabled: ${AI_CHAT_MEMORY_ENABLED:true}
      max-turns: ${AI_CHAT_MEMORY_MAX_TURNS:5}
      ttl-minutes: ${AI_CHAT_MEMORY_TTL_MINUTES:30}

  vector:
    provider: ${AI_VECTOR_PROVIDER:milvus}
    milvus:
      host: ${MILVUS_HOST:localhost}
      port: ${MILVUS_PORT:19530}
      collection-name: ${MILVUS_COLLECTION_NAME:ai_knowledge_chunk}
      dimension: ${MILVUS_DIMENSION:1024}
      auto-init-collection: ${MILVUS_AUTO_INIT_COLLECTION:true}

  tools:
    sql:
      default-limit: ${AI_SQL_DEFAULT_LIMIT:100}
      max-limit: ${AI_SQL_MAX_LIMIT:500}
      timeout-ms: ${AI_SQL_TIMEOUT_MS:3000}
      table-whitelist:
        - ai_knowledge_doc
        - ai_knowledge_chunk
        - ai_knowledge_index_task
        - ai_agent_trace_run
        - ai_agent_trace_step
        - knowledge_doc
        - knowledge_chunk
        - knowledge_index_task
    log:
      file-path: ${AI_LOG_FILE_PATH:logs/app.log}
    prometheus:
      enabled: ${AI_PROMETHEUS_ENABLED:true}
      base-url: ${PROMETHEUS_BASE_URL:http://localhost:9090}
      timeout-ms: ${PROMETHEUS_TIMEOUT_MS:3000}
      default-limit: ${PROMETHEUS_DEFAULT_LIMIT:20}
      max-limit: ${PROMETHEUS_MAX_LIMIT:100}
      default-range-minutes: ${PROMETHEUS_DEFAULT_RANGE_MINUTES:30}
      default-step: ${PROMETHEUS_DEFAULT_STEP:60s}

  agent:
    planner:
      llm-enabled: ${AI_AGENT_LLM_PLANNER_ENABLED:false}
      max-replans: ${AI_AGENT_MAX_REPLANS:2}
    harness:
      enabled: ${AI_AGENT_HARNESS_ENABLED:true}
      defaults:
        timeout-ms: ${AI_AGENT_HARNESS_TIMEOUT_MS:3500}
        max-retries: ${AI_AGENT_HARNESS_MAX_RETRIES:1}
        retry-backoff-ms: ${AI_AGENT_HARNESS_RETRY_BACKOFF_MS:120}
        snapshot-enabled: ${AI_AGENT_HARNESS_SNAPSHOT_ENABLED:true}
        snapshot-ttl-seconds: ${AI_AGENT_HARNESS_SNAPSHOT_TTL_SECONDS:600}
        fallback-summary: 工具暂时不可用，已触发 Harness 降级
      tools:
        mysql_read:
          timeout-ms: 3000
          max-retries: 0
        log_query:
          timeout-ms: 2500
          max-retries: 1
        vector_debug:
          timeout-ms: 4000
          max-retries: 1
        knowledge_search:
          timeout-ms: 4500
          max-retries: 1
        prometheus_query:
          timeout-ms: 3000
          max-retries: 1
          snapshot-enabled: true
        harness_fault:
          timeout-ms: 300
          max-retries: 1
          retry-backoff-ms: 80
          snapshot-enabled: true
          snapshot-ttl-seconds: 600
          fallback-summary: Harness 故障注入工具已触发降级

    runtime:
      fault-injection-enabled: ${AI_AGENT_RUNTIME_FAULT_INJECTION_ENABLED:true}
  memory-graph:
    pgsql:
      enabled: ${MEMORY_GRAPH_PG_ENABLED:true}
      auto-init: ${MEMORY_GRAPH_PG_AUTO_INIT:true}
      jdbc-url: ${MEMORY_GRAPH_PG_URL:jdbc:postgresql://localhost:5432/used_market}
      username: ${MEMORY_GRAPH_PG_USERNAME:postgres}
      password: ${MEMORY_GRAPH_PG_PASSWORD:}
      driver-class-name: org.postgresql.Driver
