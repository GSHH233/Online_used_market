global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # VMware 场景：Prometheus 跑在 Linux VM Docker 中，Spring Boot 跑在 Windows 宿主机。
  # Windows VMnet8 地址通常是 192.168.152.1；如果你的 VMnet8 地址变化，请同步修改。
  - job_name: online-used-marketplace
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['192.168.152.1:8080']
