global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Docker Desktop 场景：Prometheus 在容器中通过宿主机别名采集 Spring Boot。
  # Linux Docker 可通过 extra_hosts 映射 host.docker.internal，或按部署环境修改 target。
  - job_name: online-used-marketplace
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
